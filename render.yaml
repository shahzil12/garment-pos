services:
  # Laravel Backend API Service
  - type: web
    name: garment-pos-backend
    env: docker
    rootDir: backend
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: garment-pos-db
          property: connectionString

  # React Frontend Static Site
  - type: web
    name: garment-pos-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Rewrite all routes to index.html to support React Router SPA navigation
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: garment-pos-backend
          type: web
          property: host

databases:
  - name: garment-pos-db
    plan: free
